<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aysa Siddika Meem — Full-Stack Software Engineer. Building scalable products with Next.js, Node.js, Fastify, PostgreSQL and AI integrations." />

  <!-- Fonts: JetBrains Mono (UI/code) + Inter (prose) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Prevent theme flash: apply saved/system theme before paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { }
    })();
  </script>

  <title>Aysa Siddika Meem — Software Engineer</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
